name: Android

on:
  push:
    branches: [main, 'mokai/**']
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Test local document exports and model import
        run: |
          javac -encoding UTF-8 -d "$RUNNER_TEMP/mokai-tests" \
            android/src/org/mokai/coder/LocalExports.java \
            android/src/org/mokai/coder/OfflineModel.java \
            android/test/LocalToolsTest.java
          java -cp "$RUNNER_TEMP/mokai-tests" org.mokai.coder.LocalToolsTest
      - name: Install Android SDK and build tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Build signed preview APK
        env:
          MOKAI_ANDROID_KS_PASS: preview-test
          MOKAI_ANDROID_APPLICATION_ID: org.mokai.coder.preview
        run: |
          export MOKAI_ANDROID_KEYSTORE="$RUNNER_TEMP/mokai-preview.jks"
          keytool -genkeypair -keyalg RSA -keysize 2048 -validity 3650 \
            -alias mokai -dname 'CN=MokAiCoder Preview' \
            -keystore "$MOKAI_ANDROID_KEYSTORE" -storepass "$MOKAI_ANDROID_KS_PASS"
          ./android/build.sh "$RUNNER_TEMP/MokAiCoder-Offline-Preview.apk"
          unzip -Z1 "$RUNNER_TEMP/MokAiCoder-Offline-Preview.apk" | grep -Fx 'lib/arm64-v8a/libvosk.so'
          unzip -Z1 "$RUNNER_TEMP/MokAiCoder-Offline-Preview.apk" | grep -Fx 'lib/arm64-v8a/libjnidispatch.so'
      - name: Build voice and documents edition
        env:
          MOKAI_ANDROID_KS_PASS: preview-test
          MOKAI_ANDROID_EDITION: tools
        run: |
          export MOKAI_ANDROID_KEYSTORE="$RUNNER_TEMP/mokai-preview.jks"
          ./android/build.sh "$RUNNER_TEMP/MokAiCoder-Voice-Docs.apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$RUNNER_TEMP/MokAiCoder-Voice-Docs.apk" | grep -F "package: name='org.mokai.coder.tools'"
      - uses: actions/upload-artifact@v4
        with:
          name: MokAiCoder-Voice-Docs
          path: ${{ runner.temp }}/MokAiCoder-Voice-Docs.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: MokAiCoder-Offline-Preview
          path: ${{ runner.temp }}/MokAiCoder-Offline-Preview.apk
          if-no-files-found: error
