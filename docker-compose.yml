services:
  app:
    build: .
    image: mokhtar-ai-coder:latest
    container_name: mokhtar-app
    ports:
      - "${PUBLISH_ADDRESS:-127.0.0.1}:${PUBLISH_PORT:-8080}:8080"
    environment:
      NODE_ENV: production
      PORT: "8080"
      GITHUB_TOKEN: ${GITHUB_TOKEN:?Set GITHUB_TOKEN in .env}
      GITHUB_OWNER: ${GITHUB_OWNER:?Set GITHUB_OWNER in .env}
      GITHUB_REPO: ${GITHUB_REPO:?Set GITHUB_REPO in .env}
      GITHUB_BRANCH: ${GITHUB_BRANCH:-main}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
    restart: unless-stopped
