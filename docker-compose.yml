services:
  app:
    build: .
    image: mokhtar-ai-coder:latest
    container_name: mokhtar-app
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      PORT: "8080"
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GITHUB_OWNER: ${GITHUB_OWNER}
      GITHUB_REPO: ${GITHUB_REPO:-test-ai}
      GITHUB_BRANCH: ${GITHUB_BRANCH:-main}
    restart: unless-stopped
