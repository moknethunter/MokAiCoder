services:
  app:
    build: .
    image: mokhtar-ai-coder:latest
    container_name: mokhtar-app
    ports:
      - "${PUBLISH_ADDRESS:-127.0.0.1}:${PUBLISH_PORT:-8080}:8080"
    environment:
      NODE_ENV: production
      PORT: "8080"
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_OWNER: ${GITHUB_OWNER:-}
      GITHUB_REPO: ${GITHUB_REPO:-}
      GITHUB_BRANCH: ${GITHUB_BRANCH:-main}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      MOKAI_CHAT_TOKEN: ${MOKAI_CHAT_TOKEN:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      XAI_MODELS: ${XAI_MODELS:-}
      MOKAI_GITHUB_WRITE_TOKEN: ${MOKAI_GITHUB_WRITE_TOKEN:-}
      MOKAI_WORKSPACE_ROOT: ${MOKAI_WORKSPACE_ROOT:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_FREE_MODELS: ${OPENROUTER_FREE_MODELS:-openrouter/free}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      PAID_AI_API_KEY: ${PAID_AI_API_KEY:-}
      PAID_AI_BASE_URL: ${PAID_AI_BASE_URL:-}
      PAID_AI_MODELS: ${PAID_AI_MODELS:-}
      PAID_AI_TOKEN_PARAMETER: ${PAID_AI_TOKEN_PARAMETER:-max_completion_tokens}
    restart: unless-stopped
