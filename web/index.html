<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MokhtarAiCoder — Chat</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; }
    .app { max-width: 800px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; }
    header { padding: 16px; background: #1e293b; border-bottom: 1px solid #334155; }
    header h1 { margin: 0; font-size: 18px; }
    header small { color: #94a3b8; }
    #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .msg { padding: 10px 14px; border-radius: 10px; max-width: 80%; white-space: pre-wrap; word-wrap: break-word; }
    .user { align-self: flex-start; background: #2563eb; color: white; }
    .bot { align-self: flex-end; background: #1e293b; border: 1px solid #334155; }
    .err { align-self: center; background: #7f1d1d; color: #fecaca; font-size: 13px; }
    form { display: flex; gap: 8px; padding: 12px; background: #1e293b; border-top: 1px solid #334155; }
    input[type="text"] { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #e2e8f0; font-size: 15px; }
    button { padding: 12px 20px; border-radius: 8px; border: none; background: #10b981; color: white; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .scan-bar { display: flex; gap: 8px; padding: 8px 12px; background: #0f172a; border-bottom: 1px solid #334155; }
    .scan-bar button { background: #6366f1; padding: 8px 14px; font-size: 13px; }
    .status { font-size: 12px; color: #94a3b8; padding: 4px 12px; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>MokhtarAiCoder</h1>
      <small>مساعد برمجي — واجهة دردشة</small>
    </header>

    <div class="scan-bar">
      <button id="scanBtn">🔎 فحص المشروع</button>
      <span class="status" id="status">جاهز</span>
    </div>

    <div id="chat"></div>

    <form id="form">
      <input type="text" id="input" placeholder="اكتب تعليماتك... مثال: صلح الخطأ في MainActivity" autocomplete="off" />
      <button type="submit" id="sendBtn">إرسال</button>
    </form>
  </div>
  <script src="app.js"></script>
</body>
</html>
