<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MokAiCoder | فحص المشروع</title>
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="shell topbar-inner">
        <span class="wordmark" dir="ltr">MokAiCoder</span>
        <span class="topbar-label">فحص مستودعات GitHub</span>
      </div>
    </header>

    <main class="shell">
      <section class="intro" aria-labelledby="page-title">
        <div class="intro-copy">
          <h1 id="page-title">فحص المشروع</h1>
          <p>
            تتبّع التبعيات واعثر على الدورات والملفات المعزولة والرموز المكررة.
          </p>
        </div>
        <form id="scan-form" class="scan-form">
          <label for="branch">الفرع أو المرجع</label>
          <div class="scan-controls">
            <input
              id="branch"
              type="text"
              dir="ltr"
              maxlength="100"
              autocomplete="off"
              spellcheck="false"
              aria-describedby="branch-hint"
              placeholder="feature/example"
            />
            <button id="scanBtn" type="submit">فحص المشروع</button>
          </div>
          <small id="branch-hint"
            >اترك الحقل فارغًا لاستخدام الفرع الافتراضي.</small
          >
        </form>
      </section>

      <p class="status" id="status" role="status">جاهز للفحص</p>

      <section id="results" hidden aria-labelledby="results-title">
        <header class="section-heading">
          <h2 id="results-title">آخر فحص ناجح</h2>
          <p id="result-ref"></p>
        </header>
        <dl class="metrics">
          <div>
            <dt>الملفات</dt>
            <dd id="file-count">—</dd>
          </div>
          <div>
            <dt>التبعيات</dt>
            <dd id="edge-count">—</dd>
          </div>
          <div>
            <dt>الدورات</dt>
            <dd id="cycle-count">—</dd>
          </div>
          <div>
            <dt>الملفات المعزولة</dt>
            <dd id="orphan-count">—</dd>
          </div>
          <div>
            <dt>الرموز المكررة</dt>
            <dd id="duplicate-count">—</dd>
          </div>
        </dl>

        <div class="results-grid">
          <section class="panel" aria-labelledby="findings-title">
            <h3 id="findings-title">تفاصيل التبعيات</h3>
            <div id="findings"></div>
          </section>
          <section class="panel" aria-labelledby="files-title">
            <h3 id="files-title">ملفات المشروع</h3>
            <label for="filter">ابحث بمسار الملف</label>
            <input
              id="filter"
              type="search"
              dir="ltr"
              autocomplete="off"
              spellcheck="false"
            />
            <p class="file-status" id="files-status" role="status"></p>
            <ul id="files" class="file-list"></ul>
            <section
              id="preview"
              class="preview"
              hidden
              aria-labelledby="preview-title"
            >
              <h4 id="preview-title" dir="ltr"></h4>
              <p id="preview-status" role="status"></p>
              <pre
                id="code"
                dir="ltr"
                tabindex="0"
                aria-labelledby="preview-title"
                hidden
              ></pre>
            </section>
          </section>
        </div>
      </section>
    </main>
  </body>
</html>
